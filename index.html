<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internal Medicine Quiz</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">

    <!-- Sidebar (desktop) -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-logo">MedQuiz</span>
        <button id="theme-toggle" class="theme-btn" aria-label="Toggle dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
      </div>
      <nav>
        <button class="nav-item" data-nav="setup">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          Study
        </button>
        <button class="nav-item" data-nav="decks">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"/>
            <polyline points="2 17 12 22 22 17"/>
            <polyline points="2 12 12 17 22 12"/>
          </svg>
          Saved Decks
        </button>
        <button class="nav-item" data-nav="stats">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
            <line x1="2" y1="20" x2="22" y2="20"/>
          </svg>
          Stats
        </button>
        <button class="nav-item" data-nav="settings">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          Settings
        </button>
      </nav>
    </aside>

    <!-- Main content -->
    <main class="main-content">
      <div id="error-banner" class="error-banner hidden"></div>

      <!-- Setup -->
      <section id="screen-setup" class="screen">
        <h2>Configure Session</h2>
        <div class="form-group">
          <label>Topics</label>
          <div id="topic-list" class="topic-list"></div>
          <button id="select-all-topics" type="button" class="btn-link">Select All</button>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="format-select">Format</label>
            <select id="format-select">
              <option value="mixed">Mixed</option>
              <option value="multiple_choice">Multiple Choice</option>
              <option value="free_response">Free Response</option>
            </select>
          </div>
          <div class="form-group">
            <label for="count-select">Length</label>
            <select id="count-select">
              <option value="10">10 questions</option>
              <option value="20">20 questions</option>
              <option value="40">40 questions</option>
              <option value="all">All available</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="deck-name">Save as Deck <span class="label-hint">(optional)</span></label>
          <div class="input-row">
            <input type="text" id="deck-name" class="text-input" placeholder="Deck name..." />
            <button id="save-deck-btn" type="button" class="btn-outline">Save</button>
          </div>
        </div>
        <div class="start-btns">
          <button id="start-quiz-btn" type="button" class="btn-primary">Start Quiz</button>
          <button id="start-flash-btn" type="button" class="btn-secondary">Study Flashcards</button>
        </div>
      </section>

      <!-- Quiz -->
      <section id="screen-quiz" class="screen hidden">
        <div class="screen-top-bar">
          <button id="quiz-back-btn" type="button" class="btn-back">&#8592; Setup</button>
          <span id="progress-text" class="progress-text"></span>
        </div>
        <div id="question-topic-tag"></div>
        <div id="question-container"></div>
        <button id="next-btn" type="button" class="btn-primary hidden">Next</button>
      </section>

      <!-- Flashcard -->
      <section id="screen-flashcard" class="screen hidden">
        <div class="screen-top-bar">
          <button id="flash-back-btn" type="button" class="btn-back">&#8592; Setup</button>
          <span id="flash-progress" class="progress-text"></span>
        </div>
        <div id="flash-topic-tag"></div>
        <div class="fc-scene">
          <div id="fc-card" class="fc-card" role="button" aria-label="Flip card">
            <div class="fc-face fc-front">
              <div class="fc-hint">tap to reveal answer</div>
              <div id="fc-question"></div>
              <div id="fc-options"></div>
            </div>
            <div class="fc-face fc-back">
              <div id="fc-answer"></div>
              <div id="fc-explanation"></div>
            </div>
          </div>
        </div>
        <div class="fc-nav">
          <button id="fc-prev-btn" type="button" class="btn-nav">&#8592; Prev</button>
          <button id="fc-next-btn" type="button" class="btn-nav">Next &#8594;</button>
        </div>
      </section>

      <!-- Results -->
      <section id="screen-results" class="screen hidden">
        <h2>Session Complete</h2>
        <div id="score-summary"></div>
        <div id="topic-breakdown"></div>
        <button id="restart-btn" type="button" class="btn-primary">New Session</button>
      </section>

      <!-- Stats -->
      <section id="screen-stats" class="screen hidden">
        <h2>Study Stats</h2>
        <div id="stats-content"></div>
      </section>

      <!-- Decks -->
      <section id="screen-decks" class="screen hidden">
        <h2>Saved Decks</h2>
        <div id="decks-content"></div>
      </section>

      <!-- Settings -->
      <section id="screen-settings" class="screen hidden">
        <h2>Settings</h2>
        <div class="settings-list">
          <div class="settings-row">
            <div class="settings-info">
              <div class="settings-label">Dark Mode</div>
              <div class="settings-desc">Switch between light and dark theme</div>
            </div>
            <button id="settings-theme-btn" class="toggle-switch" role="switch" aria-checked="false" type="button">
              <span class="toggle-thumb"></span>
            </button>
          </div>
          <div class="settings-row">
            <div class="settings-info">
              <div class="settings-label">Clear Study History</div>
              <div class="settings-desc">Reset all progress and accuracy data</div>
            </div>
            <button id="clear-history-btn" type="button" class="btn-danger">Clear</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Mobile bottom nav -->
  <nav class="bottom-nav">
    <button class="bottom-item" data-nav="setup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span>Study</span>
    </button>
    <button class="bottom-item" data-nav="decks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"/>
        <polyline points="2 17 12 22 22 17"/>
        <polyline points="2 12 12 17 22 12"/>
      </svg>
      <span>Decks</span>
    </button>
    <button class="bottom-item" data-nav="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
        <line x1="2" y1="20" x2="22" y2="20"/>
      </svg>
      <span>Stats</span>
    </button>
    <button class="bottom-item" data-nav="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span>Settings</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
